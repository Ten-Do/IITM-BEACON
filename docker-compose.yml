services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BEACON_ENCRYPTION_KEY: ${BEACON_ENCRYPTION_KEY:?BEACON_ENCRYPTION_KEY is required}
      BEACON_EMAIL_HASH_PEPPER: ${BEACON_EMAIL_HASH_PEPPER:?BEACON_EMAIL_HASH_PEPPER is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT is required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      # Optional: the site's public origin(s) behind a reverse proxy (see .env.example).
      BEACON_ALLOWED_ORIGINS: ${BEACON_ALLOWED_ORIGINS:-}
      # Optional: the reverse proxy's address(es), whose X-Forwarded-For/-Proto are believed
      # (see .env.example). Empty: none.
      BEACON_TRUSTED_PROXIES: ${BEACON_TRUSTED_PROXIES:-}
      # Optional: Secure session and CSRF cookies (see .env.example). Never forwarded empty:
      # an empty value would leave them without Secure.
      BEACON_COOKIE_SECURE: "${BEACON_COOKIE_SECURE:-true}"
      # Optional: when the rejected-testimonial purge runs, "-" for never (see .env.example).
      # Never forwarded empty: an empty cron would stop the app from starting.
      BEACON_RETENTION_CRON: "${BEACON_RETENTION_CRON:-0 0 3 * * SUN}"
    ports:
      - "8081:8080"
    volumes:
      - uploads:/data/uploads

  maven:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-repo:/root/.m2
    entrypoint: ["mvn"]
    profiles: ["tools"]

  # Browser end-to-end tests (Playwright + headless Chromium) — see
  # Dockerfile.e2e for why they only run in this image. Extra arguments are
  # appended to `mvn -Pe2e test`, e.g.
  #   docker compose --profile tools run --rm e2e -De2e.updateScreenshots=true
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-repo:/root/.m2
    environment:
      # Browsers are baked into the image; never download others at runtime.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    # Chromium needs more shared memory than Docker's 64 MB default.
    ipc: host
    entrypoint: ["mvn", "-Pe2e", "test"]
    profiles: ["tools"]

volumes:
  postgres-data:
  uploads:
  maven-repo:
