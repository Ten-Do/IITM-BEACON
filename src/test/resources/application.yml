spring:
  datasource:
    url: jdbc:h2:mem:beacon_test;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
  # This file shadows src/main/resources/application.yml on the test classpath,
  # so the upload and photo limits and the session timeout and cookie are
  # repeated here verbatim (defaults only); config.UploadLimitsConfigTest,
  # config.SessionTimeoutConfigTest, config.SessionCookieConfigTest and
  # config.SecureCookieConfigTest fail if the two copies drift apart.
  servlet:
    multipart:
      max-file-size: ${BEACON_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${BEACON_UPLOAD_MAX_REQUEST_SIZE:1010MB}
      resolve-lazily: true

server:
  tomcat:
    max-part-count: ${BEACON_UPLOAD_MAX_PART_COUNT:500}
    # Repeated verbatim from the main file (config.RelativeRedirectsConfigTest).
    use-relative-redirects: true
  servlet:
    session:
      timeout: ${BEACON_SESSION_TIMEOUT:24h}
      cookie:
        same-site: lax
        secure: ${BEACON_COOKIE_SECURE:false}

beacon:
  web:
    # Repeated verbatim from the main file (config.AllowedOriginsConfigTest).
    allowed-origins: ${BEACON_ALLOWED_ORIGINS:}
    # Repeated verbatim from the main file (config.TrustedProxiesConfigTest).
    trusted-proxies: ${BEACON_TRUSTED_PROXIES:}
    # Repeated verbatim from the main file (config.NonUploadMultipartLimitConfigTest).
    non-upload-multipart-max-size: ${BEACON_NON_UPLOAD_MULTIPART_MAX_SIZE:16KB}
  retention:
    # Repeated verbatim from the main file (config.RetentionCronConfigTest).
    cleanup-cron: ${BEACON_RETENTION_CRON:0 0 3 * * SUN}
  crypto:
    encryption-key: aunkIRNayPvNjoN2fPob8307AX7znDryq0XhVWMZoaM=
    hmac-pepper: dev-only-insecure-pepper-do-not-use-in-prod
  storage:
    root-path: ${java.io.tmpdir:/tmp}/beacon-test-uploads
    max-photos-per-testimonial: ${BEACON_PHOTO_MAX_COUNT:50}
    max-photos-per-section: ${BEACON_PHOTO_MAX_PER_SECTION:5}
    max-photo-size-bytes: ${BEACON_PHOTO_MAX_SIZE_BYTES:20971520}
    max-pixels: ${BEACON_PHOTO_MAX_PIXELS:250000000}
    full-max-edge: ${BEACON_PHOTO_FULL_MAX_EDGE:2560}
    thumb-max-edge: ${BEACON_PHOTO_THUMB_MAX_EDGE:640}
    webp-quality: ${BEACON_PHOTO_WEBP_QUALITY:82}
    thumb-webp-quality: ${BEACON_PHOTO_WEBP_THUMB_QUALITY:75}
    backfill:
      # Off: tests that exercise submission.LegacyPhotoBackfill run it explicitly.
      enabled: false

admin:
  email: admin@example.com
  otp:
    ttl: PT5M
    max-attempts: 5
    request-limit-per-email: 1000   # deliberately generous — RateLimiterService/OtpService are
    request-window-per-email: PT1M  # Spring singletons whose state persists across @Test methods
    request-limit-per-ip: 1000      # within a class; the admin case is especially sensitive since
    request-window-per-ip: PT1M     # every admin test necessarily uses the SAME fixed admin email.
                                     # Actual rate-limit-boundary testing happens in separate,
                                     # narrowly @TestPropertySource-scoped test classes.

visitor:
  otp:
    ttl: PT5M
    max-attempts: 5
    request-limit-per-email: 1000
    request-window-per-email: PT1M
    request-limit-per-ip: 1000
    request-window-per-ip: PT1M
