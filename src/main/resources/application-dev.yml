# The dev profile names no database: run it through TestBeaconApplication
# (src/test/java), which starts a throwaway PostgreSQL 16 in Docker and points
# the app at it:
#   ./mvnw spring-boot:test-run -Dspring-boot.run.profiles=dev
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:dev}
    password: ${MAIL_PASSWORD:dev}

beacon:
  crypto:
    encryption-key: ${BEACON_ENCRYPTION_KEY:aunkIRNayPvNjoN2fPob8307AX7znDryq0XhVWMZoaM=}
    hmac-pepper: ${BEACON_EMAIL_HASH_PEPPER:dev-only-insecure-pepper-do-not-use-in-prod}
  storage:
    root-path: ${BEACON_UPLOADS_ROOT:./data/uploads-dev}

admin:
  email: ${ADMIN_EMAIL:admin@example.com}
