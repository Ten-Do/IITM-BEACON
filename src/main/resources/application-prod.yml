spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

beacon:
  crypto:
    encryption-key: ${BEACON_ENCRYPTION_KEY}
    hmac-pepper: ${BEACON_EMAIL_HASH_PEPPER}

admin:
  email: ${ADMIN_EMAIL}

server:
  servlet:
    session:
      cookie:
        # Production is served over https by a reverse proxy, while the app
        # itself sees http: JSESSIONID and XSRF-TOKEN must be Secure regardless
        # (application.yml). Set BEACON_COOKIE_SECURE=false only for a
        # deployment browsers reach over plain http.
        secure: ${BEACON_COOKIE_SECURE:true}
