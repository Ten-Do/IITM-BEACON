<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(activePage)" class="header-bar">
    <div class="header-left">
        <!-- Temporary text wordmark; swap for the real OGE logo SVG once available. Links home (decision 30). -->
        <a class="wordmark" href="/">IITM Beacon</a>
    </div>
    <!-- On phones the nav collapses behind this burger (layout/nav-toggle.html). -->
    <button th:replace="~{layout/nav-toggle :: toggle('visitor-nav')}"></button>
    <nav class="header-nav" id="visitor-nav" aria-label="Main">
        <a href="/" th:classappend="${activePage == 'home'} ? 'active' : ''">Homepage</a>
        <a href="/gallery" th:classappend="${activePage == 'gallery'} ? 'active' : ''">Browse testimonials</a>
        <a href="/submissions/login" th:classappend="${activePage == 'submit'} ? 'active' : ''">Write or edit your testimonial</a>
    </nav>
</header>
</body>
</html>
