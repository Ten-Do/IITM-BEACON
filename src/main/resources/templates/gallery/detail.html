<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/shell :: head(${testimonial.displayName()})}"></head>
<body>
<div th:replace="~{layout/header-visitor :: header('gallery')}"></div>

<main class="gallery-detail-body">
    <div class="gallery-detail-main">
        <div class="gallery-title-row">
            <span class="gallery-country-name" th:text="${testimonial.country().name()}">Country</span>
            <span class="gallery-score-badge"
                  th:style="'color: var(--score-' + ${testimonial.recommendationScore()} + ')'">
                <span class="gallery-score-dot"></span><span
                    th:text="${testimonial.recommendationScore()}">8</span>
            </span>
        </div>
        <h1 class="gallery-article-title" th:text="${testimonial.displayName()}">David J.</h1>
        <p class="gallery-score-label-line" th:text="'&quot;' + ${scoreLabel} + '&quot;'">"Score label."</p>

        <div class="gallery-topic-card" th:each="block : ${sectionBlocks}">
            <h2 class="gallery-group-heading" th:text="${block.heading()}">Group</h2>

            <div th:each="section : ${block.sections()}">
                <div class="gallery-subtopic-heading" th:if="${block.group()}">
                    <span th:text="${section.topicLabel()}">Subtopic</span>
                    <span class="gallery-updated-badge" th:if="${section.updated()}">Updated</span>
                </div>
                <span class="gallery-updated-badge" th:if="${!block.group() and section.updated()}">Updated</span>
                <p class="gallery-answer-text" th:text="${section.answer()}">Answer text.</p>
                <div class="gallery-photo-row" th:if="${!section.photos().isEmpty()}">
                    <img class="gallery-photo-thumb" th:each="photo : ${section.photos()}" th:src="${photo.url()}"
                         alt="" data-photo-viewer-item="true"
                         th:attr="data-url=${photo.url()},data-caption=${block.group() ? (block.heading() + ' — ' + section.topicLabel()) : section.topicLabel()}"/>
                </div>
            </div>
        </div>
    </div>

    <div class="gallery-sidebar">
        <div class="gallery-side-card" th:if="${testimonial.hasRevealableContact() and contacts == null}">
            <a class="gallery-reveal-btn" th:href="@{/gallery/{id}(id=${testimonial.id()}, reveal=true)}">Reveal contact info</a>
        </div>
        <div class="gallery-side-card" th:if="${contacts != null}">
            <p class="gallery-side-title">Contact</p>
            <div class="gallery-contact-list">
                <span class="gallery-contact-chip" th:each="contact : ${contacts}"
                      th:text="${contact.type()} + ': ' + ${contact.value()}">Email: someone@example.com</span>
            </div>
        </div>
        <div class="gallery-side-card" th:if="${!achievementLabels.isEmpty()}">
            <p class="gallery-side-title">Achievements</p>
            <div class="gallery-achievements-list">
                <span class="gallery-achievement-chip" th:each="label : ${achievementLabels}"
                      th:text="${label}">Made new friends</span>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/shell :: photoViewerTemplate}"></div>
<script src="/js/photo-viewer.js"></script>
</body>
</html>
