# Messages for errors raised while binding the submission form
# (SubmissionViewController), shown next to their field. Without these a
# type mismatch would render Spring's own "Failed to convert property
# value..." text, which names internal types. Codes are tried most specific
# first: typeMismatch.<field>, then typeMismatch.<type>, then typeMismatch.
typeMismatch.admissionYear=must be a year, e.g. 2021
typeMismatch.recommendationScore=must be a whole number from 0 to 10
typeMismatch.java.lang.Integer=must be a whole number
typeMismatch=has a value that cannot be read
