<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    :root {
      --maroon: #AE152D; --olive: #4B7043; --ink: #17161C; --ink-soft: #5B534C;
      --paper: #FFFFFF; --sand: #F7F4EF; --line: #E6DFD3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--maroon); text-decoration: none; }
    :focus-visible { outline: 2px solid var(--maroon); outline-offset: 2px; }
    .page { font-family: 'Roboto', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--sand); min-height: 100%; display: flex; flex-direction: column; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 40px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo { height: 30px; width: auto; }
    .admin-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--maroon); border: 1px solid var(--maroon); border-radius: 6px; padding: 2px 8px; }
    .header-nav { display: flex; gap: 20px; }
    .header-nav a { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
    .header-nav a:hover, .header-nav a.active { color: var(--maroon); }
    .body { padding: 40px; }
    .title { font-size: 24px; font-weight: 700; margin: 0 0 20px 0; }
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 72px 20px; border: 1.5px dashed var(--line); border-radius: 8px; background: var(--paper); }
    .empty-icon { width: 40px; height: 40px; stroke: var(--olive); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .empty-title { font-size: 17px; font-weight: 700; margin: 0; }
    .empty-hint { font-size: 14px; color: var(--ink-soft); margin: 0; max-width: 380px; line-height: 1.5; }
  </style>
</helmet>
<div class="page">
  <div class="header-bar">
    <div class="header-left">
      <img src="oge-logo.svg" alt="OGE logo" class="header-logo">
      <span class="admin-badge">Moderator</span>
    </div>
    <div class="header-nav">
      <a href="#" class="active">Queue</a>
      <a href="#">Catalog</a>
    </div>
  </div>
  <div class="body">
    <h1 class="title">Pending queue</h1>
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <h3 class="empty-title">Nothing waiting for review</h3>
      <p class="empty-hint">Every submission has been decided. New and edited testimonials will appear here as they come in.</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
