<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    :root {
      --maroon: #AE152D; --maroon-dark: #8C001E; --ink: #17161C; --ink-soft: #5B534C;
      --paper: #FFFFFF; --sand: #F7F4EF; --line: #E6DFD3; --red: #D9261C; --red-soft: #FBEAE8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--maroon); text-decoration: none; }
    a:hover { color: var(--maroon-dark); text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--maroon); outline-offset: 2px; }
    .page { font-family: 'Roboto', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--sand); min-height: 100%; display: flex; flex-direction: column; }
    .header-bar { display: flex; align-items: center; gap: 14px; padding: 14px 40px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-logo { height: 30px; width: auto; }
    .header-name { font-size: 15px; font-weight: 700; }
    .body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .wrap { width: 100%; max-width: 420px; }
    .title { font-size: 24px; font-weight: 700; margin: 0 0 6px 0; text-align: center; }
    .subtitle { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 24px 0; text-align: center; }
    .subtitle strong { color: var(--ink); }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 18px; align-items: center; box-shadow: 0 8px 24px rgba(148, 156, 168, 0.2); }
    .error-banner { display: flex; gap: 10px; align-items: flex-start; background: var(--red-soft); border: 1px solid var(--red); border-radius: 6px; padding: 12px 14px; width: 100%; }
    .error-mark { color: var(--red); font-weight: 700; }
    .error-text { font-size: 14px; line-height: 1.5; color: var(--ink); margin: 0; }
    .otp-row { display: flex; gap: 10px; }
    .otp-cell { width: 48px; height: 56px; border: 1.5px solid var(--red); border-radius: 6px; text-align: center; font-size: 22px; font-weight: 700; font-family: 'Roboto', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 6px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; width: 100%; }
    .btn-primary { background: var(--maroon); color: #fff; }
    .btn-ghost { background: transparent; color: var(--ink-soft); border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .state-note { font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin: 16px 0 0 0; padding-left: 12px; border-left: 2px solid var(--line); }
  </style>
</helmet>

<div class="page">
  <div class="header-bar">
    <img src="oge-logo.svg" alt="OGE logo" class="header-logo">
    <span class="header-name">IITM Beacon</span>
  </div>
  <div class="body">
    <div class="wrap">
      <h1 class="title">Enter your code</h1>
      <p class="subtitle">We sent a 6-character code to <strong>you@example.com</strong>.</p>
      <div class="card">
        <div class="error-banner">
          <span class="error-mark">!</span>
          <p class="error-text">That code is wrong or has expired. Check your email, or request a new one.</p>
        </div>
        <div class="otp-row">
          <input class="otp-cell" maxlength="1" value="4">
          <input class="otp-cell" maxlength="1" value="Q">
          <input class="otp-cell" maxlength="1" value="7">
          <input class="otp-cell" maxlength="1" value="X">
          <input class="otp-cell" maxlength="1" value="2">
          <input class="otp-cell" maxlength="1" value="B">
        </div>
        <button class="btn btn-primary">Verify</button>
        <button class="btn-ghost">Resend code</button>
      </div>
      <p class="state-note">Drawn in its wrong-code state — the error banner is absent on a first attempt and appears after a failed check, same template either way.</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
