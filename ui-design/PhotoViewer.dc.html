<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    :root { --maroon: #AE152D; --ink: #17161C; --paper: #FFFFFF; --line: #E6DFD3; --sand: #F7F4EF; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .page { font-family: 'Roboto', system-ui, -apple-system, sans-serif; height: 100%; position: relative; background: var(--ink); overflow: hidden; }
    .backdrop { position: absolute; inset: 0; background: rgba(31, 25, 23, 0.94); display: flex; align-items: center; justify-content: center; }
    .close-btn { position: absolute; top: 24px; right: 32px; width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .close-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn { width: 48px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .nav-btn svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .viewer-row { display: flex; align-items: center; gap: 32px; }
    .photo-frame { width: 720px; height: 480px; background: var(--sand); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .photo-frame svg { width: 64px; height: 64px; stroke: #8A8079; stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
    .caption { position: absolute; bottom: 28px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .caption-text { color: #fff; font-size: 14px; font-weight: 600; }
    .caption-count { color: rgba(255,255,255,0.65); font-size: 13px; }
  </style>
</helmet>

<div class="page">
  <div class="backdrop">
    <button class="close-btn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    <div class="viewer-row">
      <button class="nav-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <div class="photo-frame">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </div>
      <button class="nav-btn"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    </div>
    <div class="caption">
      <span class="caption-text">Academics — Were the courses challenging, easy, or about what you expected?</span>
      <span class="caption-count">3 / 7</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
